# Status of the Lean formalization. The Lean page (/lean/) renders this file.
# Edit it as the formalization progresses; nothing else needs to change.
#
# status of an item: planned | in-progress | verified | prose
#   verified = in the project, builds, no sorry, standard axioms only, no native_decide
#   prose    = deliberately argued on paper, not in Lean

project:
  toolchain: "Lean 4, Mathlib v4.35.0"
  repo: ""        # link to the Lean project (folder or repository) once it exists
  download: ""    # URL of a .zip of the project; the download button appears when set
  commit: ""      # commit hash the status below refers to

build: |
  lake exe cache get
  lake build

# What "Lean-verified" means (the mathathon rules).
guarantees:
  - The project builds.
  - No `sorry` anywhere.
  - Only the standard axioms (`propext`, `Classical.choice`, `Quot.sound`); check with `#print axioms`.
  - No `native_decide`.

# Proposed scope, following the literature review (literature/topics/Q5-formalization.md):
# definitions and the correctness "iff" of the reduction in Lean, plus a size bound;
# running time argued in prose. To be confirmed by the Lean team.
items:
  - id: defs
    title: "Definitions: HP strings, folds on the cubic lattice, the score"
    status: planned
  - id: iso
    title: "The cube has the smallest surface: n³ nodes have surface ≥ 6n², equality only for the cube"
    status: planned
  - id: cube
    title: "A fold of a string with n³ H's reaches the score bound only if its H's fill a cube"
    status: planned
  - id: iff
    title: "Correctness of the reduction: a perfect fold exists iff the packing instance has a solution"
    status: planned
  - id: size
    title: The string has polynomial length
    status: planned
  - id: time
    title: The reduction runs in polynomial time
    status: prose
