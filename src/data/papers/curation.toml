[papers.chandru2003algorithmics]
themes = ["background"]
gist = "A 2003 survey of algorithms for folding on lattices."
takeaway = "It calls the hardness proofs involved and sketches the construction of Berger and Leighton. The proof that a perfect fold gives a packing is left out, and the 2D proof is only named."
