gist = "The standard survey of the mathematics of lattice HP models."
takeaway = "It restates both hardness theorems without proofs and lists hardness on the hexagonal lattice as open. Its Theorem 3.7 states the 2D parity bound without the term for H's at the ends of the string; that form fails for HPPHPHPH (our check)."
why = "It describes both proofs as involved and gives no simpler one. Its list of hardness results ends in 1999."
