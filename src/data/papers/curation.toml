# Curation overlay for the papers map and the list of papers (Context page).
#
# scripts/build_papers.py merges this file with the facts in ../literature/
# (INDEX.md: year, relevance, reading status; refs.bib: authors, title, DOI/URL;
# notes/<key>.md) and writes src/data/papers/papers.json. Run, from site/:
#
#     python3 scripts/build_papers.py          # regenerate papers.json
#     python3 scripts/build_papers.py --check  # validate only
#
# What lives here: judgement and reader-facing wording, not facts.
#   - themes (the lanes of the timeline and the groups of the list, in display order),
#   - per paper:
#       themes     first = lane and list group
#       gist       one clause on what the paper shows; the line a reader sees by default
#                  (under about 100 characters)
#       takeaway   more detail, shown on demand after the gist; must not repeat the gist
#       why        why it matters for this problem, shown on demand
#       relations  to other papers; optional venue / statusNote overrides
#   - extra papers that are in refs.bib but not in INDEX.md.
# Every fact must be supported by literature/notes/ or literature/topics/.
# Keep quotations out of this file: the Context page allows at most one quote.
# Write for a reader: short plain sentences, no abbreviations, "we" for the team
# (see .claude/skills/unslop/SKILL.md at the repo root).
#
# Relation kinds (A -> B, stored on A):
#   reduces-from  A's hardness proof reduces from the problem of B
#   builds-on     A uses a result, gadget or technique of B
#   extends       A strengthens or generalizes B
#   variant-of    A studies a variant of the problem in B
#   refutes       A finds an error in B
#   surveys       A surveys or restates B
#   formalizes    A formalizes something from B
#   answers       A answers a question left open in B
#   discusses     A discusses or critiques B without changing its result

# ---------------------------------------------------------------- themes (lanes, in order)

[[themes]]
id = "core"
label = "The hardness proofs"
short = "Hardness proofs"
color = "--h"
description = "The two 1998 proofs that two-letter HP folding is NP-complete."

[[themes]]
id = "variants"
label = "Folding variants"
short = "Variants"
color = "--p"
description = "Hardness with another alphabet, energy, lattice or angle rule, a given region, or a restricted set of folds."

[[themes]]
id = "sources"
label = "Source problems and gadgets"
short = "Sources & gadgets"
color = "--diff-1"
description = "Problems a reduction can start from, and constructions the proofs borrow."

[[themes]]
id = "approx"
label = "Approximation"
short = "Approximation"
color = "--bond"
description = "Algorithms that reach a fixed fraction of the optimal score."

[[themes]]
id = "design"
label = "Inverse folding and sequence design"
short = "Inverse folding"
color = "--st-conjecture"
description = "Given a shape, choose the H/P string. One published hardness proof in this area is wrong."

[[themes]]
id = "formal"
label = "Formalization"
short = "Formalization"
color = "--st-lean"
description = "The HP model in Lean, and NP-completeness in Lean, Coq and Isabelle."

[[themes]]
id = "background"
label = "Surveys and background"
short = "Background"
color = "--st-cited"
description = "The origin of the model, surveys and lectures that restate the proofs, and a classical inequality."

