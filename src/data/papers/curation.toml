]

[papers.loomis1949inequality]
themes = ["background"]
gist = "Bounds the size of a set by the sizes of its projections onto the coordinate planes."
takeaway = "Theorem 2 is the discrete form: for a set S of unit cubes, |S|² is at most the product of the sizes of its three projections. The paper has no case of equality."
why = "Berger and Leighton's cube lemma says that n³ H's have the most contacts exactly when they fill a cube. They give no source. Its inequality is this one; the case of equality is proved by Atkins and Hart."

[papers.clisby2013calculation]
themes = ["background"]
gist = "Estimates how fast the number of self-avoiding walks on the cubic lattice grows: about 4.684 per step."
takeaway = "The estimate comes from simulations with the pivot algorithm, which samples very long walks. It is a numerical value, not a theorem; no exact value is known."
why = "Every fold of a string is a self-avoiding walk, so a string with n+1 letters has roughly 4.68 to the power n folds on the cubic lattice. Trying them all is hopeless, but that alone does not make folding hard."

