  { to = "crescenzi1998complexity", kind = "surveys", note = "Theorem 4.9: the 2D result, which the survey describes as a reduction from Hamiltonian cycle with Trevisan codes." },
  { to = "hart1996fast", kind = "surveys", note = "Approximation algorithms and the parity bound (Theorems 3.6–3.8). Theorem 3.7 drops the term for H's at the ends of the string." },
  { to = "ngo1992computational", kind = "surveys", note = "Listed among the hardness theorems (Theorem 4.1)." },
  { to = "fraenkel1993complexity", kind = "surveys", note = "Listed among the hardness theorems (Theorem 4.2)." },
  { to = "unger1993finding", kind = "surveys", note = "Listed among the hardness theorems (Theorem 4.3)." },
  { to = "paterson1996complexity", kind = "surveys", note = "Listed among the hardness theorems." },
  { to = "hart1997robust", kind = "surveys", note = "Listed among the hardness theorems (Theorem 4.5)." },
  { to = "nayak1998spatial", kind = "surveys", note = "Listed among the hardness theorems." },
  { to = "atkins1999intractability", kind = "surveys", note = "Listed among the hardness theorems (Theorem 4.8)." },
]

