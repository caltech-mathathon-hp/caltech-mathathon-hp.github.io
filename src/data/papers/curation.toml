gist = "Bounds the size of a set by the sizes of its projections onto the coordinate planes."
takeaway = "Theorem 2 is the discrete form: for a set S of unit cubes, |S|² is at most the product of the sizes of its three projections. The paper has no case of equality."
why = "Berger and Leighton's cube lemma says that n³ H's have the most contacts exactly when they fill a cube. They give no source. Its inequality is this one; the case of equality is proved by Atkins and Hart."

