# Settings for scripts/build_lean.py, which writes certificate.json (next to this file) and the
# project zip from the teammate's Lean project. Edit by hand, then run
#   python3 scripts/build_lean.py
# (add --repo PATH to read the project from another clone).

[source]
# Where the Lean project lives on GitHub; the page's links are built from this.
repo_url = "https://github.com/caltech-mathathon-hp/caltech-mathathon-hp.github.io"
# The git ref the script reads, in the repo given by --repo (default: the repo holding site/).
ref = "HEAD"
# The branch name, for links when no commit is known.
branch = "main"
# The Lean project's folder in that repo.
path = "lean/cubic"
# Declaration names on the page and in docs/theorem-index.md are relative to this namespace.
namespace = "ProteinFolding"
zip = "lean/lean-cubic.zip"   # under public/

[show]
# Declarations the page shows besides those named in docs/theorem-index.md (names relative to the namespace).
# The last two are the first steps of the reduction chain SAT → 3D matching → bin packing.
extra = [
  "HPStringFold", "latticeDistance", "cube", "hydrophobicSites", "HPInstance", "PerfectInstance",
  "cubeBondThreshold", "PerfectIffThreshold", "PolyTimeDecidable", "KarpReduces",
  "ThreeDimensionalMatching.cnfToBlockMatching_karp", "MatchingPacking.matching_karpReduces_modified",
]
