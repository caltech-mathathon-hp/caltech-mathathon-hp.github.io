name = "shelf"
version = "0.1.0"
defaultTargets = ["Shelf"]

# Same Lean and Mathlib release as the team's statement library below.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"

# The team's Lean library, which states the problem and proves the other steps.
# `vendor/protein_folding` is an unchanged copy of it; `vendor/README.md` says
# which commit it was copied from.
[[require]]
name = "protein_folding"
path = "vendor/protein_folding"

[[lean_lib]]
name = "Shelf"
