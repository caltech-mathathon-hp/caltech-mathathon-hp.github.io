<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Snake meets the 3-D HP protein folding problem: steer the growing chain step by step through an infinite cubic lattice, hug as many H's together as you can, and don't bite yourself.">
<title>HP Snake 3D</title>
<script>
  // Light or dark, like the website: the ?theme= parameter, else the site's own choice in localStorage.
  // The script at the end of the page follows later changes.
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get('theme'); } catch (e) { /* old browser */ }
    if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* Colours: the website's tokens (site/src/styles/tokens.css), copied, since this page has no build step.
     Light is the default; dark applies under html[data-theme='dark']. The canvas reads the same variables. */
  :root {
    --bg: #fbfaf7; --bg-elev: #ffffff; --bg-sunk: #f2f0eb;
    --ink: #1c1c21; --muted: #55555f; --faint: #8b8b95;
    --line: #e2ded5; --line-strong: #c9c3b7;
    --accent: #1f4f8f; --accent-hover: #163a6b; --accent-weak: #e7eef7; --on-accent: #ffffff;
    --h: #c4532f; --p: #4f7aa3; --p-fill: #e6ecf2;
    --bond: #d99a1e; --gold: #a86f12; --on-gold: #1c1c21;
    --backbone: #6d6d78; --ghost: #1f4f8f;
    --ok: #2f7a4d; --bad: #b3261e;
    --panel: rgba(255, 255, 255, .92);
    --shadow: 0 2px 4px rgba(28, 28, 33, .05), 0 8px 24px rgba(28, 28, 33, .07);
    --scrim: rgba(28, 28, 33, .32);
    --round: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html[data-theme='dark'] {
    --bg: #131417; --bg-elev: #1b1c20; --bg-sunk: #0e0f11;
    --ink: #e7e5e0; --muted: #a6a5ad; --faint: #75747d;
    --line: #2c2d33; --line-strong: #3d3e45;
    --accent: #85aee6; --accent-hover: #a9c7f0; --accent-weak: #1c2838; --on-accent: #0e0f11;
    --h: #e2774f; --p: #86a9cc; --p-fill: #2a3038;
    --bond: #ebb444; --gold: #ebb444; --on-gold: #0e0f11;
    --backbone: #8e8d97; --ghost: #85aee6;
    --ok: #6cc08f; --bad: #f08078;
    --panel: rgba(27, 28, 32, .92);
    --shadow: 0 2px 4px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-sunk); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#cv { position: fixed; inset: 0; display: block; cursor: grab; }
  canvas#cv.drag { cursor: grabbing; }
  canvas#cv.pointy { cursor: pointer; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: var(--shadow); }

  /* ---------- top-left: title + level */
  #tl { position: fixed; left: 16px; top: 16px; padding: 10px 14px 11px; max-width: min(340px, calc(50vw - 24px)); }
  .brand { font: 800 20px/1.1 var(--round); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .cube { display: inline-grid; grid-template-columns: repeat(2, 7px); gap: 2px; transform: rotate(-12deg) skewX(-8deg); }
  .cube i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  /* H filled, P hollow, as everywhere on the site */
  i.h, .dot.h { background: var(--h); }
  i.p, .dot.p { background: var(--p-fill); box-shadow: inset 0 0 0 var(--ring, 1.5px) var(--p); }
  .brand sup { font-size: 11px; color: var(--gold); font-weight: 800; margin-left: -4px; }
  #lvlName { margin-top: 5px; font-weight: 650; font-size: 13.5px; }
  #lvlMeta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); background: transparent; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--ink); border-color: var(--line-strong); }
  .chip.off { opacity: .55; text-decoration: line-through; }

  /* ---------- top-right: energy */
  #tr { position: fixed; right: 16px; top: 16px; padding: 12px 16px; width: min(300px, calc(50vw - 24px)); }
  .erow { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .erow + .erow { margin-top: 6px; }
  .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
  .lab i { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 500; display: block; font-size: 11px; margin-top: 1px; }
  .big { font: 800 34px/1 var(--round); font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
  #eYou.bump { animation: bump .35s ease-out; }
  @keyframes bump { 30% { transform: scale(1.18); color: var(--gold); } }
  #eOpt { color: var(--gold); }
  .bar { position: relative; height: 8px; border-radius: 99px; background: var(--bg-sunk); margin: 11px 0 7px; overflow: hidden; }
  #barFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--h) 65%, var(--bg-elev)), var(--h) 55%, var(--bond)); transition: width .25s; }
  .small { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #reach.bad { color: var(--bad); } #reach.ok { color: var(--ok); }

  /* ---------- bottom: sequence strip */
  #bottom { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(980px, calc(100vw - 32px));
    display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  #strip { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap, 4px); padding: 9px 12px; max-width: 100%; }
  #strip i { width: var(--d, 14px); height: var(--d, 14px); border-radius: 50%; display: block; transition: transform .15s, opacity .2s; }
  #strip i.done { opacity: .25; }
  #strip i.next { transform: scale(1.45); box-shadow: 0 0 0 2px var(--bg-elev), 0 0 0 3.5px var(--ink); }
  #strip i.p.next { box-shadow: inset 0 0 0 1.5px var(--p), 0 0 0 2px var(--bg-elev), 0 0 0 3.5px var(--ink); }
  #keys { font-size: 11.5px; color: var(--faint); margin-top: 6px; text-align: center; }
  kbd { font: 600 10.5px/1 ui-monospace, Menlo, monospace; padding: 2px 5px; border-radius: 5px; border: 1px solid var(--line-strong);
    color: var(--muted); background: var(--bg-elev); }

  #prompt { position: fixed; left: 50%; transform: translateX(-50%); font: 700 14.5px var(--round); color: var(--ink);
    background: var(--panel); padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line);
    animation: pulse 1.6s ease-in-out infinite; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulse { 50% { opacity: .55; } }
  #banner { position: fixed; left: 50%; transform: translateX(-50%); font: 700 13px var(--round); color: var(--gold);
    background: var(--panel); padding: 7px 14px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--bond) 55%, transparent); white-space: nowrap; }

  /* ---------- result card */
  #result { position: fixed; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 14px 18px 16px; text-align: center; }
  .rtitle { font: 800 24px/1.15 var(--round); }
  .rtitle.bad { color: var(--bad); }
  .rsub { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
  .rstats { margin-top: 8px; font-variant-numeric: tabular-nums; font-size: 13px; }
  .rstats b { font-weight: 700; }
  .newbest { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--on-gold); background: var(--bond); border-radius: 99px; padding: 1px 7px; vertical-align: 1px; }
  .stars { font-size: 28px; letter-spacing: 4px; color: var(--bond); line-height: 1; margin-bottom: 4px; }
  .stars .off, .ms .off { color: var(--line-strong); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 13px; }
  .btn { font: 650 13px var(--round); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--bg-sunk); border-color: var(--faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn kbd { margin-left: 6px; }
  .btn.primary kbd { color: var(--on-accent); border-color: color-mix(in srgb, var(--on-accent) 40%, transparent); background: color-mix(in srgb, var(--on-accent) 12%, transparent); }

  /* ---------- menu overlay */
  #ov { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    overflow-y: auto; padding: 28px 16px; touch-action: pan-y; }
  #menuCard { width: min(900px, 100%); margin: 0 auto; padding: 24px 26px 22px; position: relative; }
  .title { font: 900 46px/1 var(--round); letter-spacing: -.03em; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .title .cube { grid-template-columns: repeat(2, 13px); gap: 4px; }
  .title .cube i { width: 13px; height: 13px; --ring: 2.5px; }
  .title sup { font-size: 20px; color: var(--gold); margin-left: -8px; }
  .tag { color: var(--muted); font-size: 15.5px; margin-top: 7px; }
  .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 18px; }
  @media (max-width: 560px) { .rules { grid-template-columns: 1fr; } }
  .rule { background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .rule b { color: var(--ink); }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; --ring: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 18px 0 8px; font-weight: 700; }
  .lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 9px; }
  .lv { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-elev); cursor: pointer; }
  .lv:hover { border-color: var(--accent); background: var(--accent-weak); }
  .lv.cur { border-color: var(--bond); }
  .lvtop { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 700; }
  .ms { color: var(--bond); font-size: 12px; letter-spacing: 1px; }
  .lvdots { display: flex; flex-wrap: wrap; gap: 2px; margin: 7px 0 6px; }
  .lvdots i { width: 6px; height: 6px; border-radius: 50%; display: block; --ring: 1.2px; }
  .lvmeta { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #custom { flex: 1; min-width: 200px; font: 13px ui-monospace, Menlo, monospace; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink); text-transform: uppercase; user-select: text; -webkit-user-select: text; }
  #custom:focus { outline: none; border-color: var(--accent); }
  .err { color: var(--bad); font-size: 12.5px; min-height: 1.2em; margin-top: 6px; }
  .foot { color: var(--faint); font-size: 12px; margin-top: 14px; line-height: 1.55; }
  .foot b { color: var(--muted); }
  .x { position: absolute; right: 14px; top: 14px; }
  .dimlink { margin-top: 14px; }

  /* ---------- touch d-pad */
  #dpad { position: fixed; right: 14px; bottom: 76px; display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 4px; }
  #dpad button { border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 19px; color: var(--ink); touch-action: none; }
  #dpad button.depth { font-size: 22px; color: var(--gold); }
  #dpad button.rot { font-size: 17px; color: var(--muted); }
  #dpad button:active { background: var(--accent-weak); }

  @media (max-width: 640px) {
    #tl { padding: 8px 10px; } .brand { font-size: 16px; } #lvlName { font-size: 12.5px; }
    #tr { padding: 9px 11px; } .big { font-size: 25px; } .lab i { display: none; }
    .small { flex-direction: column; gap: 1px; }
    .title { font-size: 34px; } #menuCard { padding: 18px 16px; }
    #keys { display: none; }
  }
  @media (pointer: coarse) { #keys { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="tl" class="panel">
  <div class="brand"><span class="cube"><i class="h"></i><i class="p"></i><i class="p"></i><i class="h"></i></span>HP Snake <sup>3D</sup></div>
  <div id="lvlName">—</div>
  <div id="lvlMeta">—</div>
  <div class="chips">
    <button class="chip" data-act="menu" title="Levels (Esc)">☰ levels</button>
    <button class="chip" id="chipHints" data-act="hints" title="Toggle hot-spot hints (H)">💡 hints</button>
    <button class="chip" id="chipSound" data-act="sound" title="Toggle sound (M)">🔊 sound</button>
    <button class="chip" data-act="view" title="Reset the camera (V)">🎥 view</button>
  </div>
</div>

<div id="tr" class="panel" aria-live="polite">
  <div class="erow"><span class="lab">Your energy<i>E = −(# H–H contacts)</i></span><span id="eYou" class="big">0</span></div>
  <div class="erow"><span class="lab">Theoretical min E*<i id="eSrc">…</i></span><span id="eOpt" class="big">…</span></div>
  <div class="bar"><div id="barFill"></div></div>
  <div class="small"><span id="cnt">0 / ? contacts</span><span id="reach"></span></div>
</div>

<div id="bottom">
  <div id="strip" class="panel"></div>
  <div id="keys"><kbd>← ↑ → ↓</kbd> / <kbd>WASD</kbd> across the screen · <kbd>Q</kbd> into · <kbd>E</kbd> out of the screen · drag to orbit · <kbd>Z</kbd> undo · <kbd>H</kbd> hints · <kbd>R</kbd> restart · <kbd>Esc</kbd> levels</div>
</div>

<div id="prompt" hidden></div>
<div id="banner" hidden></div>
<div id="result" class="panel" hidden></div>

<div id="dpad" hidden>
  <button class="depth" data-int="in" aria-label="into the screen">⊗</button><button data-int="up" aria-label="up">▲</button><button class="depth" data-int="out" aria-label="out of the screen">⊙</button>
  <button data-int="left" aria-label="left">◀</button><button data-undo="1" aria-label="undo">↶</button><button data-int="right" aria-label="right">▶</button>
  <button class="rot" data-rot="-1" aria-label="rotate view left">⟲</button><button data-int="down" aria-label="down">▼</button><button class="rot" data-rot="1" aria-label="rotate view right">⟳</button>
</div>

<div id="ov" hidden><div id="menuCard" class="panel"></div></div>

<script>
'use strict';
// =====================================================================================
//  Constants & levels
// =====================================================================================
// directions on the cubic lattice: 0 = +x, 1 = +y (up), 2 = +z (towards the default camera), 3 = −x, 4 = −y, 5 = −z
const DV = [[1, 0, 0], [0, 1, 0], [0, 0, 1], [-1, 0, 0], [0, -1, 0], [0, 0, -1]];
const OPP = d => (d + 3) % 6;
const MOVES = 'RUFLDB';                                   // move letters, same order as DV
const TAU = Math.PI * 2;

// =====================================================================================
//  Theme: light or dark, like the website. The page starts in the theme the script in <head>
//  chose, then follows the site: the 'storage' event when the site page changes localStorage.theme,
//  and messages {hpSnake: 'theme', theme: 'light' | 'dark'} from the page that frames this one.
//  Every colour the canvas draws with comes from PAL, which is rebuilt from the CSS variables.
// =====================================================================================
const rgbOf = hex => { const v = parseInt(hex.trim().replace('#', ''), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
const mixC = (a, b, t) => { const p = rgbOf(a), q = rgbOf(b); return '#' + p.map((v, i) => Math.round(v + (q[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const rgb = hex => rgbOf(hex).join(',');                // for rgba(), when the alpha changes per frame
const rgba = (c, a) => `rgba(${c.startsWith('#') ? rgb(c) : c},${a})`;
let PAL = null;
function readPalette() {
  const cs = getComputedStyle(document.documentElement), v = k => cs.getPropertyValue(k).trim();
  const dark = document.documentElement.dataset.theme === 'dark';
  const bg = v('--bg-sunk'), glow = v('--bg-elev'), ink = v('--ink'), h = v('--h'), p = v('--p'), pFill = v('--p-fill');
  const bond = v('--bond'), backbone = v('--backbone'), lineStrong = v('--line-strong'), fog = mixC(bg, glow, 0.6);
  PAL = {
    dark, bg, h, p, bond, ghost: v('--ghost'),
    hRGB: rgb(h), badRGB: rgb(v('--bad')), bad: v('--bad'),
    vignette: glow, vignetteA: dark ? 0.8 : 0.9,           // a soft light in the middle of the board
    fog, fogRGB: rgb(fog),                                  // far beads fade towards the background
    gridRGB: rgb(lineStrong), gridA: 0.9,
    shadowRGB: dark ? '0,0,0' : rgb(ink), shadowA: dark ? 0.45 : 0.16,
    guide: rgba(ink, 0.25), startRing: rgba(ink, 0.4),     // drop line under the head, ring round residue 1
    // sphere gradients (highlight, body, rim): H filled, P hollow with a ring of --p, as in the site's 3D game
    shadeH: [mixC(h, '#ffffff', 0.6), h, mixC(h, '#000000', 0.4)],
    shadeP: [mixC(pFill, '#ffffff', dark ? 0.15 : 1), pFill, mixC(pFill, p, 0.4)],
    labelH: rgba(glow, 0.9), labelP: p,                     // as the site's string: H in the card colour, P in --p
    bondOutRGB: rgb(dark ? mixC(backbone, '#000000', 0.35) : backbone),   // the chain: a dark tube, a light core
    bondInRGB: rgb(mixC(backbone, '#ffffff', dark ? 0.4 : 0.6)),
    bondGlow: rgba(bond, dark ? 0.7 : 0.45),
    cap: rgba(glow, 0.95), capLine: lineStrong, capInk: ink, // key caps look like the site's <kbd>
    capDepth: rgba(bond, 0.95), onGold: v('--on-gold'),
    badgeLine: bg,
    eyeWhite: '#ffffff', pupil: '#1c1c21', eyeInkH: '#1c1c21', eyeInkP: dark ? ink : '#1c1c21',
    gold: v('--gold'), halo: rgba(bg, 0.85),               // the floating "+1 hug", outlined in the background colour
    spark: dark ? '#ffffff' : v('--accent'),               // the white sparks of the dark theme
  };
}
function setTheme(t) {
  if (t !== 'light' && t !== 'dark') return;
  if (document.documentElement.dataset.theme !== t) document.documentElement.dataset.theme = t;
  readPalette();
  if (VW) draw(performance.now());                      // at once, even if frames are throttled
}
addEventListener('storage', e => {
  if (e.key !== 'theme' && e.key !== null) return;       // null: localStorage was cleared
  let t = null; try { t = localStorage.getItem('theme'); } catch (err) { /* blocked */ }
  setTheme(t === 'dark' ? 'dark' : 'light');
});
addEventListener('message', e => {
  const d = e.data;
  if (d && typeof d === 'object' && d.hpSnake === 'theme') setTheme(d.theme);
});
readPalette();

// opt = max # of H–H contacts (E* = −opt); fold = move string of an optimal fold (R/L = ±x, U/D = ±y, F/B = ±z).
// Every fold below was checked to reach `opt`; that `opt` is the maximum was shown by exhaustive search
// (branch & bound below, or scripts/hp-optimum.ts on the site), and for the 27-H cube by isoperimetry.
const LEVELS = [
  { name: 'Hairpin',      seq: 'HPPH',             opt: 1,  fold: 'RUL',             kind: 'warm' },
  { name: 'Zig-zag',      seq: 'HPHPPHPH',         opt: 3,  fold: 'RURULLD',         kind: 'warm' },
  { name: 'Clamp',        seq: 'HHPHPPHPHH',       opt: 5,  fold: 'RULUFDRDL',       kind: 'warm' },
  { name: 'Twins',        seq: 'HPPHHPPHHPPH',     opt: 5,  fold: 'RULURFLDRDL',     kind: 'warm' },
  { name: 'Sugar cube',   seq: 'HHHHHHHH',         opt: 5,  fold: 'RULFRDL',         kind: 'warm' },
  { name: 'Loops',        seq: 'PHHPPHHPPHHPPHHP', opt: 8,  fold: 'RRRULLLFRRRDLLL', kind: 'warm' },
  { name: 'Little core',  seq: 'HPHHPPHHHHPHHHPH', opt: 10, fold: 'RULUFDLBDLFRRRU', kind: 'warm' },
  { name: 'Benchmark 20', seq: 'HPHPPHHPHPPHPHHPPHPH', opt: 11, fold: 'RURULLLFLDRBRFDRUUL', kind: 'bench',
    src: 'exact · exhaustive search' },
  { name: 'The 3×3×3 cube', seq: 'HHHHHHHHHHHHHHHHHHHHHHHHHHH', opt: 28, fold: 'RRULLURRFLLDRRDLLFRRULLURR', kind: 'bench',
    src: 'proved · isoperimetry' },
];
LEVELS.forEach((L, i) => { L.idx = i; });

// =====================================================================================
//  Exact solver: branch & bound over self-avoiding walks (also shipped into a Web Worker)
// =====================================================================================
function solveHP3(seq, timeLimitMs) {
  const n = seq.length;
  const H = Uint8Array.from(seq, c => (c === 'H' ? 1 : 0));

    case 'sound': settings.muted = !settings.muted; store.set('muted', settings.muted); updateHUD(); if (!settings.muted) beep(660, 0.1, 'sine', 0.05); break;
    case 'random': closeMenu(); newGame(randomLevel()); break;
    case 'custom': {
      const raw = ($('#custom').value || '').toUpperCase().replace(/[\s,]/g, '');
      const err = $('#customErr');
      if (/[^HP]/.test(raw)) { err.textContent = 'Only H and P please — this is the HP model, not the alphabet soup model.'; return; }
      if (raw.length < 3) { err.textContent = 'At least 3 residues. A dipeptide has very little folding drama.'; return; }
      if (raw.length > 60) { err.textContent = 'Max 60 residues in 3-D — there is a lot of room to get lost in up here.'; return; }
      closeMenu(); newGame({ name: 'Custom chain', seq: raw, kind: 'custom' });

const KEYINT = { ArrowRight: 'right', KeyD: 'right', ArrowLeft: 'left', KeyA: 'left', ArrowUp: 'up', KeyW: 'up',
                 ArrowDown: 'down', KeyS: 'down', KeyQ: 'in', KeyE: 'out', PageUp: 'in', PageDown: 'out' };
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') act('custom'); if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const c = e.code;
  if (c in KEYINT) {
    if (menuOpen) return;
    e.preventDefault();
    let it = KEYINT[c];
    if (e.shiftKey && it === 'up') it = 'in';
    if (e.shiftKey && it === 'down') it = 'out';
    onIntent(it);
    return;
  }
  switch (c) {
    case 'KeyJ': orbit(-Math.PI / 4, 0); break;
    case 'KeyL': orbit(Math.PI / 4, 0); break;
    case 'KeyI': orbit(0, 0.25); break;
    case 'KeyK': orbit(0, -0.25); break;
    case 'KeyV': act('view'); break;
    case 'KeyR': if (!menuOpen && G) newGame(LV); break;
    case 'KeyZ': case 'Backspace': e.preventDefault(); if (!menuOpen) undo(); break;
    case 'KeyH': act('hints'); break;
    case 'KeyM': act('sound'); break;
    case 'KeyO': if (!menuOpen) toggleOpt(); break;
    case 'KeyN': if (!menuOpen && G && G.state === 'done') nextLevel(); break;
    case 'Escape': if (menuOpen) closeMenu(); else openMenu(); break;
    case 'Enter': case 'NumpadEnter':

});

// pointer on the board: drag = orbit, pinch / wheel = zoom, tap on a bubble = place the next residue there
const ptrs = new Map();
let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: cam.zoom }; drag = null;
  }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) { cv.classList.toggle('pointy', !!ghostAt(e.clientX, e.clientY)); return; }
  p.x = e.clientX; p.y = e.clientY;
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    cam.zoom = clamp(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch.d), 0.4, 3);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; cv.classList.add('drag'); }
  if (drag.moved) {
    cam.yaw -= dx * 0.009; cam.tyaw = cam.yaw;
    cam.pitch = clamp(cam.pitch + dy * 0.007, PITCH_MIN, PITCH_MAX); cam.tpitch = cam.pitch;
    cam.userOrbit = true;
  }
  drag.x = e.clientX; drag.y = e.clientY;
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && !drag.moved && e.type === 'pointerup') {
    const g = ghostAt(e.clientX, e.clientY);
    if (g) onDir(g.d);
  }
  if (!ptrs.size) { drag = null; cv.classList.remove('drag'); }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0015), 0.4, 3); }, { passive: false });

// =====================================================================================
//  Camera & projection
// =====================================================================================
const YAW0 = 0.62, PITCH0 = 0.5, PITCH_MIN = 0.12, PITCH_MAX = 1.45;
const cam = { yaw: YAW0, pitch: PITCH0, tyaw: YAW0, tpitch: PITCH0, zoom: 1, userOrbit: false,
              x: 0, y: 0, z: 0, tx: 0, ty: 0, tz: 0, s: 50, ts: 50, rad: 2, trad: 2, floor: -1, tfloor: -1,
              dist: 14, shake: 0, ox: 0, oy: 0 };
const B = { r: [1, 0, 0], u: [0, 1, 0], c: [0, 0, 1] };   // camera right, up, and towards-the-viewer vectors
const view = { cx: 0, cy: 0, w: 1, h: 1 };
let VW = 0, VH = 0, DPR = 1;

function updateBasis() {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  B.c = [cp * sy, sp, cp * cy];
  B.r = [cy, 0, -sy];
  const f = [-B.c[0], -B.c[1], -B.c[2]], r = B.r;
  B.u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
}
// world → screen; returns [X, Y, scale, depth towards the viewer]
function proj(x, y, z) {
  const vx = x - cam.x, vy = y - cam.y, vz = z - cam.z, { r, u, c } = B;
  const X = vx * r[0] + vy * r[1] + vz * r[2];
  const Y = vx * u[0] + vy * u[1] + vz * u[2];
  const Z = vx * c[0] + vy * c[1] + vz * c[2];
  const k = cam.dist / Math.max(0.6, cam.dist - Z);
  return [view.cx + X * k * cam.s + cam.ox, view.cy - Y * k * cam.s + cam.oy, k, Z];
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  layoutStrip(); measure(); positionFloaters();
  if (G && !$('#result').hidden) $('#result').style.bottom = (innerHeight - $('#bottom').getBoundingClientRect().top + 8) + 'px';
  camTarget(true);
}
function measure() {
  const tr = $('#tr').getBoundingClientRect(), tl = $('#tl').getBoundingClientRect();
  let top = Math.max(tr.bottom, tl.bottom) + 10;
  const res = $('#result');
  let bot = VH - (res.hidden ? $('#bottom') : res).getBoundingClientRect().top + 10;
  const maxInset = VH * 0.62;
  if (top + bot > maxInset) { const f = maxInset / (top + bot); top *= f; bot *= f; }
  view.w = VW; view.h = Math.max(80, VH - top - bot); view.cx = VW / 2; view.cy = top + view.h / 2;
}
function shownChain() {
  if (G.showOpt && OPT.fold) { const f = OPT.fold; return { xs: f.xs, ys: f.ys, zs: f.zs, k: f.xs.length, contacts: f.contacts, born: null }; }
  return { xs: G.xs, ys: G.ys, zs: G.zs, k: G.k, contacts: G.contacts, born: G.born };
}
function isLive() { return G && !G.showOpt && (G.state === 'running' || G.state === 'ready'); }
function camTarget(snap) {
  if (!G) return;
  const c = shownChain(), live = isLive();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (let i = 0; i < c.k; i++) {
    x0 = Math.min(x0, c.xs[i]); x1 = Math.max(x1, c.xs[i]); y0 = Math.min(y0, c.ys[i]); y1 = Math.max(y1, c.ys[i]);
    z0 = Math.min(z0, c.zs[i]); z1 = Math.max(z1, c.zs[i]);
  }
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, mz = (z0 + z1) / 2;
  let rad = 0;
  for (let i = 0; i < c.k; i++) rad = Math.max(rad, Math.hypot(c.xs[i] - mx, c.ys[i] - my, c.zs[i] - mz));
  rad += live ? 1.35 : 0.7;                              // room for the bubbles around the head
  cam.tx = mx; cam.ty = my; cam.tz = mz; cam.trad = rad;
  cam.tfloor = y0 - 1;
  cam.ts = clamp(Math.min(view.w, view.h) / (2 * rad + 0.9), 14, 92);
  if (snap) { cam.x = mx; cam.y = my; cam.z = mz; cam.rad = rad; cam.s = cam.ts; cam.floor = cam.tfloor; }
}

// =====================================================================================
//  Effects
// =====================================================================================
function burst(x, y, z, n, colors, speed = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1), v = speed * (0.4 + Math.random());
    parts.push({ x, y, z, vx: Math.sin(b) * Math.cos(a) * v, vy: Math.cos(b) * v, vz: Math.sin(b) * Math.sin(a) * v,
                 life: 1, decay: 1.4 + Math.random() * 1.2, r: 0.04 + Math.random() * 0.06, c: pick(colors) });
  }
}
function launchConfetti() {
  const cols = [PAL.h, PAL.p, PAL.bond, PAL.spark, PAL.bad];
  for (let i = 0; i < 180; i++) confetti.push({
    x: Math.random() * VW, y: -20 - Math.random() * VH * 0.5, vx: (Math.random() - 0.5) * 80, vy: 90 + Math.random() * 160,
    rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 10, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: pick(cols),
  });
}
function updateFX(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], f = Math.exp(-dt * 3);
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vx *= f; p.vy *= f; p.vz *= f; p.life -= p.decay * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.vx += Math.sin(p.y / 40) * 4 * dt;
    if (p.y > VH + 30) confetti.splice(i, 1);
  }
  const now = performance.now();
  for (let i = floats.length - 1; i >= 0; i--) if (now - floats[i].t0 > 1200) floats.splice(i, 1);
  cam.shake *= Math.exp(-dt * 5);
  if (cam.shake < 0.01) cam.shake = 0;
  cam.ox = cam.shake ? (Math.random() - 0.5) * cam.shake * 18 : 0;
  cam.oy = cam.shake ? (Math.random() - 0.5) * cam.shake * 18 : 0;
}

// =====================================================================================
//  Rendering
// =====================================================================================
const ctx = cv.getContext('2d');
let ghostHits = [];                                      // screen circles of the bubbles, for taps

function ghostAt(X, Y) {
  let bestG = null, bz = -1e9;
  for (const g of ghostHits) if (Math.hypot(X - g.X, Y - g.Y) < g.R && g.Z > bz) { bz = g.Z; bestG = g; }
  return bestG;
}

function drawFloor() {
  const fy = cam.floor, cx = Math.round(cam.x), cz = Math.round(cam.z), ext = Math.ceil(cam.rad + 3.5);
  ctx.lineWidth = 1;
  const seg = (x1, z1, x2, z2) => {
    const d = Math.hypot((x1 + x2) / 2 - cam.x, (z1 + z2) / 2 - cam.z) / ext;
    if (d >= 1) return;
    const a = proj(x1, fy, z1), b = proj(x2, fy, z2);
    ctx.strokeStyle = `rgba(${PAL.gridRGB},${PAL.gridA * Math.pow(1 - d, 1.4)})`;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  };
  for (let i = -ext; i <= ext; i++) for (let j = -ext; j < ext; j++) { seg(cx + i, cz + j, cx + i, cz + j + 1); seg(cx + j, cz + i, cx + j + 1, cz + i); }
}

function shadeBead(X, Y, rad, isH, fog, alpha = 1) {
  const s = isH ? PAL.shadeH : PAL.shadeP;
  const g = ctx.createRadialGradient(X - rad * 0.38, Y - rad * 0.42, rad * 0.08, X, Y, rad);
  g.addColorStop(0, s[0]); g.addColorStop(0.45, s[1]); g.addColorStop(1, s[2]);
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(X, Y, rad, 0, TAU); ctx.fillStyle = g; ctx.fill();
  if (fog > 0.01) { ctx.fillStyle = `rgba(${PAL.fogRGB},${fog})`; ctx.fill(); }
  if (!isH) {                                            // P is hollow: a ring of --p, inside the bead
    const lw = Math.max(1, rad * 0.12);
    ctx.strokeStyle = fog > 0.01 ? mixC(PAL.p, PAL.fog, fog) : PAL.p; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(X, Y, Math.max(0.5, rad - lw / 2), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawEyes(X, Y, r, mood, now, look, ink) {
  for (const side of [-1, 1]) {
    const ex = X + r * 0.38 * side + look[0] * r * 0.12, ey = Y - r * 0.12 + look[1] * r * 0.12;
    if (mood === 'dead') {
      const q = r * 0.17;
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.5, r * 0.11); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - q, ey - q); ctx.lineTo(ex + q, ey + q); ctx.moveTo(ex + q, ey - q); ctx.lineTo(ex - q, ey + q); ctx.stroke();
    } else if (mood === 'happy') {
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.5, r * 0.11); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey + r * 0.06, r * 0.17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else {
      const blink = (now % 3400) < 110;
      ctx.fillStyle = PAL.eyeWhite;
      ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.23, blink ? r * 0.04 : r * 0.23, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba(ink, 0.35); ctx.lineWidth = Math.max(0.8, r * 0.04); ctx.stroke();   // shows on a pale P
      if (!blink) { ctx.fillStyle = PAL.pupil; ctx.beginPath(); ctx.arc(ex + look[0] * r * 0.09, ey + look[1] * r * 0.09, r * 0.11, 0, TAU); ctx.fill(); }
    }
  }
}

function residueXYZ(c, i, now) {
  let x = c.xs[i], y = c.ys[i], z = c.zs[i];
  if (c.born && i > 0) {
    const t = (now - c.born[i]) / 90;
    if (t < 1) { const e = easeOutCubic(Math.max(0, t)); x = c.xs[i - 1] + (x - c.xs[i - 1]) * e; y = c.ys[i - 1] + (y - c.ys[i - 1]) * e; z = c.zs[i - 1] + (z - c.zs[i - 1]) * e; }
  }
  return [x, y, z];
}

function drawScene(now) {
  const c = shownChain(), live = isLive(), S = cam.s, R0 = 0.31;
  const W3 = [], P = [];
  for (let i = 0; i < c.k; i++) { const w = residueXYZ(c, i, now); W3.push(w); P.push(proj(w[0], w[1], w[2])); }
  const fogOf = Z => clamp(0.5 - Z / (2 * cam.rad + 1), 0, 1) * 0.42;

  // shadows on the floor, and a drop line under the head
  const sp = Math.max(0.22, Math.sin(cam.pitch));
  for (let i = 0; i < c.k; i++) {
    const [x, y, z] = W3[i], q = proj(x, cam.floor, z), h = Math.max(0, y - cam.floor);
    const rx = R0 * 1.15 * S * q[2];
    ctx.fillStyle = `rgba(${PAL.shadowRGB},${PAL.shadowA / (1 + 0.45 * (h - 1))})`;
    ctx.beginPath(); ctx.ellipse(q[0], q[1], rx, rx * sp, 0, 0, TAU); ctx.fill();
  }
  if (c.k && live) {
    const [x, y, z] = W3[c.k - 1], a = P[c.k - 1], b = proj(x, cam.floor, z);
    ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = PAL.guide; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.restore();
  }

  // everything that needs depth sorting
  const items = [];
  for (let i = 0; i < c.k; i++) items.push({ t: 0, i, Z: P[i][3] });
  for (let i = 1; i < c.k; i++) items.push({ t: 1, i, Z: (P[i][3] + P[i - 1][3]) / 2 - 0.01 });
  for (const ct of c.contacts) if (ct[0] < c.k && ct[1] < c.k) items.push({ t: 2, ct, Z: (P[ct[0]][3] + P[ct[1]][3]) / 2 - 0.02 });

  ghostHits = [];
  const ghosts = [];
  if (live && G.k < G.n) {
    const k = G.k, hx = G.xs[k - 1], hy = G.ys[k - 1], hz = G.zs[k - 1];
    for (let d = 0; d < 6; d++) {
      if (k > 1 && d === OPP(G.lastDir)) continue;
      const x = hx + DV[d][0], y = hy + DV[d][1], z = hz + DV[d][2];
      if (G.occ.has(keyOf(x, y, z))) continue;
      const q = proj(x, y, z), gh = { d, q, g: gainAt(x, y, z, k) };
      ghosts.push(gh);
      items.push({ t: 3, gh, Z: q[3] });
      ghostHits.push({ X: q[0], Y: q[1], R: Math.max(20, R0 * S * q[2] * 1.25), Z: q[3], d });
    }
  }
  if (live && settings.hints) {
    const remH = [0, 0];
    for (let i = G.k; i < G.n; i++) if (G.H[i]) remH[i & 1]++;
    const hot = new Map(), reach = reachInfo().seen;
    for (let i = 0; i < G.k; i++) {
      if (!G.H[i]) continue;
      for (const d of DV) {
        const x = G.xs[i] + d[0], y = G.ys[i] + d[1], z = G.zs[i] + d[2], key = keyOf(x, y, z);
        if (!reach.has(key) || !remH[(((x + y + z) % 2) + 2) % 2]) continue;   // a site only ever hosts residues of one parity
        const h = hot.get(key);
        if (h) h.n++; else hot.set(key, { x, y, z, n: 1 });
      }
    }
    for (const h of hot.values()) { const q = proj(h.x, h.y, h.z); items.push({ t: 4, q, n: h.n, Z: q[3] - 0.03 }); }
  }
  items.sort((a, b) => a.Z - b.Z);

  const headI = c.k - 1, pulse = 0.85 + 0.15 * Math.sin(now / 320);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of items) {
    if (it.t === 0) {                                    // residue
      const i = it.i, [X, Y, k] = P[i], isH = G.seq[i] === 'H';
      let rr = R0 * S * k;
      if (c.born) { const t = (now - c.born[i]) / 240; if (t < 1) rr *= Math.max(0.2, easeOutBack(Math.max(0, t))); }
      shadeBead(X, Y, rr, isH, fogOf(it.Z));
      if (i === 0) {
        ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = PAL.startRing; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(X, Y, rr * 1.45, 0, TAU); ctx.stroke(); ctx.restore();
      }
      if (i !== headI && rr > 9) {
        ctx.font = `700 ${Math.round(rr * 0.9)}px ui-rounded, system-ui, sans-serif`;
        ctx.fillStyle = isH ? PAL.labelH : PAL.labelP;
        ctx.fillText(isH ? 'H' : 'P', X, Y + 0.5);
      }
      if (i === headI) {
        let mood = 'normal';
        if (G.showOpt || G.state === 'done') mood = 'happy';
        else if (G.state === 'dead') mood = 'dead';
        const dv = DV[dirOf(c.xs, c.ys, c.zs, c.k)];
        let lx = dv[0] * B.r[0] + dv[1] * B.r[1] + dv[2] * B.r[2], ly = -(dv[0] * B.u[0] + dv[1] * B.u[1] + dv[2] * B.u[2]);
        const ll = Math.hypot(lx, ly); if (ll > 1) { lx /= ll; ly /= ll; }
        drawEyes(X, Y, rr, mood, now, [lx, ly], isH ? PAL.eyeInkH : PAL.eyeInkP);
      }
    } else if (it.t === 1) {                             // backbone bond
      const a = P[it.i - 1], b = P[it.i], k = (a[2] + b[2]) / 2, fog = fogOf(it.Z);
      ctx.lineCap = 'round';
      ctx.strokeStyle = `rgba(${PAL.bondOutRGB},${1 - fog})`; ctx.lineWidth = Math.max(2.5, S * 0.16 * k);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      ctx.strokeStyle = `rgba(${PAL.bondInRGB},${0.9 - fog})`; ctx.lineWidth = Math.max(1.2, S * 0.07 * k);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    } else if (it.t === 2) {                             // H–H contact
      const [i, j, born] = it.ct, a = P[i], b = P[j], k = (a[2] + b[2]) / 2;
      const flash = born ? Math.max(0, 1 - (now - born) / 700) : 0;
      ctx.save();
      ctx.lineCap = 'round'; ctx.setLineDash([Math.max(3, S * k * 0.12), Math.max(2.5, S * k * 0.09)]); ctx.lineDashOffset = -now / 35;
      ctx.strokeStyle = PAL.bond; ctx.shadowColor = PAL.bondGlow; ctx.shadowBlur = Math.max(4, S * 0.25);
      ctx.globalAlpha = 1 - fogOf(it.Z) * 0.8;
      ctx.lineWidth = Math.max(1.5, S * k * 0.07) * (1 + 1.6 * flash);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      ctx.restore();
    } else if (it.t === 3) {                             // bubble for the next residue
      const { q } = it.gh, rr = R0 * S * q[2] * 0.9, isH = G.H[G.k];
      shadeBead(q[0], q[1], rr, isH, 0, 0.3);
      ctx.save(); ctx.globalAlpha = 0.6; ctx.setLineDash([3, 3]); ctx.strokeStyle = PAL.ghost; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(q[0], q[1], rr, 0, TAU); ctx.stroke(); ctx.restore();
    } else {                                             // hint glow
      const [X, Y, k] = it.q, R = S * k * 0.42;
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, R);
      g.addColorStop(0, `rgba(${PAL.hRGB},${(0.12 + 0.09 * it.n) * pulse})`);
      g.addColorStop(1, `rgba(${PAL.hRGB},0)`);
      ctx.fillStyle = g; ctx.fillRect(X - R, Y - R, 2 * R, 2 * R);
    }
  }

  // key caps on the bubbles, always on top so you can read them
  for (const gh of ghosts) {
    const [X, Y, k] = gh.q, rr = R0 * S * k * 0.9, it = MAP.intentOfDir[gh.d];
    const lab = (COARSE ? TOUCH_LABEL : KEY_LABEL)[it], fs = Math.round(clamp(rr * 0.85, 11, 18));
    ctx.font = `800 ${fs}px ui-rounded, system-ui, sans-serif`;
    const w = Math.max(fs * 1.25, ctx.measureText(lab).width + 8), h = fs * 1.3;
    const depth = it === 'in' || it === 'out';
    ctx.fillStyle = depth ? PAL.capDepth : PAL.cap;
    ctx.beginPath(); roundRect(X - w / 2, Y - h / 2, w, h, 5); ctx.fill();
    if (!depth) { ctx.strokeStyle = PAL.capLine; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = depth ? PAL.onGold : PAL.capInk; ctx.fillText(lab, X, Y + 1);
    if (gh.g > 0) {
      const bx = X + rr * 0.95, by = Y - rr * 0.95, br = Math.max(8, rr * 0.5);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fillStyle = PAL.bond; ctx.fill();
      ctx.strokeStyle = PAL.badgeLine; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = PAL.onGold; ctx.font = `800 ${Math.round(br * 1.1)}px ui-rounded, system-ui, sans-serif`;
      ctx.fillText('+' + gh.g, bx, by + 0.5);
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawDeath(now) {
  const d = G.death, k = G.k - 1, p = 0.5 + 0.5 * Math.sin(now / 110);
  const q = d.type === 'clash' ? proj(d.x, d.y, d.z) : proj(G.xs[k], G.ys[k], G.zs[k]);
  const r = cam.s * 0.31 * q[2];
  ctx.strokeStyle = `rgba(${PAL.badRGB},${0.45 + 0.55 * p})`; ctx.lineWidth = Math.max(2, cam.s * 0.07);
  ctx.beginPath(); ctx.arc(q[0], q[1], r * (1.45 + 0.25 * p), 0, TAU); ctx.stroke();
  if (d.type === 'clash') {
    const s = r * 0.7;
    ctx.beginPath(); ctx.moveTo(q[0] - s, q[1] - s); ctx.lineTo(q[0] + s, q[1] + s); ctx.moveTo(q[0] + s, q[1] - s); ctx.lineTo(q[0] - s, q[1] + s); ctx.stroke();
  }
}

function drawFX(now) {
  const S = cam.s;
  for (const p of parts) {
    const q = proj(p.x, p.y, p.z);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(q[0], q[1], Math.max(1.2, p.r * S * q[2]), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    const t = (now - f.t0) / 1200, q = proj(f.x, f.y, f.z);
    ctx.globalAlpha = Math.max(0, 1 - t * t);
    ctx.font = `800 ${Math.round(clamp(S * 0.42, 14, 24))}px ui-rounded, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = PAL.halo;
    const X = q[0], Y = q[1] - t * S * 1.1;
    ctx.strokeText(f.text, X, Y); ctx.fillStyle = PAL.gold; ctx.fillText(f.text, X, Y);
  }
  ctx.globalAlpha = 1;
  for (const p of confetti) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
}

function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, VW, VH);
  const vg = ctx.createRadialGradient(VW / 2, view.cy, 0, VW / 2, view.cy, Math.max(VW, VH) * 0.7);
  vg.addColorStop(0, rgba(PAL.vignette, PAL.vignetteA)); vg.addColorStop(1, rgba(PAL.vignette, 0));
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  if (!G) return;
  drawFloor();
  drawScene(now);
  if (!G.showOpt && G.state === 'dead') drawDeath(now);
  drawFX(now);
}

// =====================================================================================
//  Main loop
// =====================================================================================
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (G) {
    camTarget();
    // a slow victory spin while you admire the finished fold (until you grab the camera)
    if (!cam.userOrbit && !drag && (G.state === 'done' || G.showOpt)) cam.tyaw += dt * 0.35;
  }
  const f = 1 - Math.exp(-dt * 5), fa = 1 - Math.exp(-dt * 7);
  cam.x += (cam.tx - cam.x) * f; cam.y += (cam.ty - cam.y) * f; cam.z += (cam.tz - cam.z) * f;
  cam.rad += (cam.trad - cam.rad) * f; cam.floor += (cam.tfloor - cam.floor) * f;
  cam.s += (cam.ts * cam.zoom - cam.s) * f;
  if (!drag) { cam.yaw += (cam.tyaw - cam.yaw) * fa; cam.pitch += (cam.tpitch - cam.pitch) * fa; }
  cam.dist = 9 + 2 * cam.rad;
  updateBasis();
  updateMap();
  updateFX(dt);
  draw(t);
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
updateBasis(); updateMap();
newGame(LEVELS[0]);
resize();
openMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
